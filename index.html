<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#101418" />
  <meta name="description" content="在浏览器里第一人称漫游中国高铁二等座车厢（程序化几何 3D 演示）" />
  <title>HSR-Cabin · 高铁车厢漫游</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101418'/%3E%3Cpath d='M6 20h20v3H6zM9 14h14v3H9z' fill='%23c9a15a'/%3E%3Cpath d='M6 8h20v3H6z' fill='%23c0392b'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <!-- HUD 由 ui/hud.ts 动态构建；boot 遮罩用于分帧生成场景时的进度显示 -->
    <div id="boot">
      <div class="boot-card">
        <div class="boot-title">HSR-Cabin</div>
        <div class="boot-sub">正在程序化生成车厢…</div>
        <div class="boot-bar"><div id="boot-fill"></div></div>
        <div id="boot-step">初始化</div>
      </div>
    </div>
    <div id="gl-error">
      <div class="card">
        <h2>无法启动 3D 渲染</h2>
        <p>当前浏览器或 WebView 不支持 WebGL。请尝试使用较新的 Chrome / Edge / Safari 打开本页。</p>
        <p class="detail"></p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
