name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.detect.outputs.has_project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Detect project files
        id: detect
        run: echo "has_project=${{ hashFiles('package.json') != '' }}" >> "$GITHUB_OUTPUT"

  quality:
    needs: detect
    # main is the repository bootstrap branch and does not yet contain the
    # Vite + TypeScript project; skip cleanly until package.json lands there.
    if: ${{ needs.detect.outputs.has_project == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
